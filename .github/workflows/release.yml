# Generated by scripts/build_mirrors.py in https://github.com/Jafesu/DeckBeacon. Do not edit here.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches the packaged version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python3 -c "import json;print(json.load(open('custom_components/deckbeacon/manifest.json'))['version'])")"
          if [ "$want" != "$have" ]; then echo "tag $GITHUB_REF_NAME != version $have"; exit 1; fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Generated from https://github.com/Jafesu/DeckBeacon (see SOURCE). Changelog and issues live in the monorepo." 
