# Generated by scripts/build_mirrors.py in https://github.com/Jafesu/DeckBeacon. Do not edit here.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish a release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c "import json;print(json.load(open('custom_components/deckbeacon/manifest.json'))['version'])")"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already released"; exit 0; fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "Generated from https://github.com/Jafesu/DeckBeacon (see SOURCE). Changelog and issues live in the monorepo." 
